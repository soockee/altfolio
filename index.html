<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>altfolio</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 34rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
    line-height: 1.5;
  }
  pre {
    background: color-mix(in srgb, currentColor 8%, transparent);
    padding: 0.75rem;
    border-radius: 0.3rem;
    white-space: pre-wrap;
    word-break: break-all;
  }
  button {
    font: inherit;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }
  .error { color: #c0392b; }
  section { margin-top: 2rem; }

  .viz-root {
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --series-1: #2a78d6;
    --row-hover: color-mix(in srgb, var(--series-1) 10%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --series-1: #3987e5;
      --row-hover: color-mix(in srgb, var(--series-1) 16%, transparent);
    }
  }

  #stats { display: flex; flex-direction: column; gap: 1.75rem; }
  .chart-title { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--text-primary); }
  .chart-rows { display: flex; flex-direction: column; gap: 6px; }
  .chart-empty { color: var(--text-muted); }

  .bar-row {
    display: grid;
    grid-template-columns: 8rem 1fr 2.5rem;
    align-items: center;
    gap: 0.5rem;
    padding: 3px 4px;
    border-radius: 4px;
    outline: none;
  }
  .bar-row:hover, .bar-row:focus-visible { background: var(--row-hover); }
  .bar-label {
    color: var(--text-secondary);
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track { height: 14px; }
  .bar-fill {
    height: 100%;
    min-width: 4px;
    background: var(--series-1);
    border-radius: 0 4px 4px 0;
  }
  .bar-value {
    color: var(--text-secondary);
    font-size: 0.85rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .bar-tooltip {
    position: absolute;
    z-index: 10;
    background: #0b0b0b;
    color: #fcfcfb;
    padding: 0.35rem 0.55rem;
    border-radius: 0.3rem;
    font-size: 0.8rem;
    line-height: 1.3;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <h1>altfolio</h1>

  <section>
    <h2>Redirect URI</h2>
    <p>Register this exact URL as the redirect URI on your OAuth client:</p>
    <pre id="redirect-uri"></pre>
  </section>

  <section>
    <h2>Sign in</h2>
    <button id="login-btn">Sign in with Battle.net</button>
    <button id="logout-btn" hidden>Sign out</button>
    <pre id="status">Not signed in.</pre>
  </section>

  <section id="stats-section" hidden>
    <h2>Your characters</h2>
    <div id="stats">
      <div id="faction-chart"></div>
      <div id="race-chart"></div>
      <div id="class-chart"></div>
    </div>
  </section>

  <script src="oauth-config.js"></script>
  <script src="oauth.js"></script>
  <script src="profile.js"></script>
  <script src="charts.js"></script>
  <script>
    document.getElementById("redirect-uri").textContent = window.OAUTH_CONFIG.redirectUri;

    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");

    const statsSection = document.getElementById("stats-section");

    loginBtn.addEventListener("click", () => BnetAuth.login());
    logoutBtn.addEventListener("click", () => {
      BnetAuth.logout();
      statsSection.hidden = true;
      render();
    });

    function render() {
      const token = BnetAuth.getAccessToken();
      loginBtn.hidden = !!token;
      logoutBtn.hidden = !token;
      if (token) {
        statusEl.textContent = "Signed in.\naccess_token: " + token;
        statusEl.classList.remove("error");
      } else if (!statusEl.classList.contains("error")) {
        statusEl.textContent = "Not signed in.";
      }
    }

    async function loadStats() {
      const token = BnetAuth.getAccessToken();
      if (!token) return;

      statsSection.hidden = false;
      try {
        const characters = await BnetProfile.fetchCharacters(token);
        BnetCharts.renderBarChart(
          document.getElementById("faction-chart"),
          "Faction",
          BnetProfile.countBy(characters, "faction"),
        );
        BnetCharts.renderBarChart(
          document.getElementById("race-chart"),
          "Race",
          BnetProfile.countBy(characters, "race"),
        );
        BnetCharts.renderBarChart(
          document.getElementById("class-chart"),
          "Class",
          BnetProfile.countBy(characters, "class"),
        );
      } catch (err) {
        statsSection.hidden = true;
        statusEl.textContent = err.message;
        statusEl.classList.add("error");
      }
    }

    (async () => {
      const result = BnetAuth.parseCallback();
      if (result && result.error) {
        statusEl.textContent = result.error;
        statusEl.classList.add("error");
      } else if (result && result.code) {
        statusEl.textContent = "Exchanging code for a token…";
        try {
          await BnetAuth.exchangeCode(result.code);
        } catch (err) {
          statusEl.textContent = err.message;
          statusEl.classList.add("error");
        }
      }
      render();
      await loadStats();
    })();
  </script>
</body>
</html>
